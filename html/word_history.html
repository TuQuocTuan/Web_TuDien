<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử tra từ - Wordee</title>
    
    <link rel="stylesheet" href="../css/word_history.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <header id="header">
        <div class="header-left">
            <div class="logo">
                <a href="index.html">Wordee</a>
            </div>
            <nav class="main-nav">
                <a href="word_list.html">Từ vựng</a>
                <a href="album.html">Danh sách từ</a>
                <a href="practice_list.html">Luyện tập</a>
            </nav>
        </div>
        <div class="header-right">
             <div class="auth-buttons">
                <a href="login.html" class="btn-login">Đăng nhập</a>
            </div>
        </div>
    </header>

    <main id="content">
        <div class="history-layout-container">
            
            <aside class="filter-sidebar">
                <h3><i class="fas fa-filter"></i> Lọc theo ngày</h3>

                <div class="filter-group">
                    <label for="date-picker" style="display:block; margin-bottom: 5px; font-weight: 500;">Chọn ngày cụ thể:</label>
                    <input type="date" id="date-picker" class="date-input" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px;">
                </div>

                <div class="filter-group">
                    <div class="filter-option">
                        <input type="radio" id="filter-all" name="filter-date" value="all" checked>
                        <label for="filter-all">Tất cả</label>
                    </div>
                    <div class="filter-option">
                        <input type="radio" id="filter-today" name="filter-date" value="today">
                        <label for="filter-today">Hôm nay</label>
                    </div>
                </div>
                
                <!-- <button class="clear-history-btn">
                    <i class="fas fa-trash-alt"></i> Xóa lịch sử
                </button> -->
            </aside>

            <section class="history-list-section">
                
                <h1>Lịch sử tra từ</h1>

                <div class="word-list" id="search-history-list">
                    <p style="text-align: center; color: #666; margin-top: 20px;">Đang tải dữ liệu...</p>
                </div> 

            </section>

        </div> 
    </main>

    <footer id="footer">
        <div class="footer-content">
            <h3>Wordee</h3>
            <p>&copy; 2025 Wordee. Phát triển bởi bạn.</p>
        </div>
    </footer>

    <script src="../js/search_history.js"></script>

</body>
</html>
