<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử tra từ - Wordee</title>

    <link rel="stylesheet" href="../css/word_history.css">
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/main.css">

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>

    <header id="header">
        <div class="header-left">
            <div class="logo">
                <a href="index.html">Wordee</a>
            </div>
            <nav class="main-nav">
                <a href="word_list.html">Từ vựng</a>
                <a href="album.html" class="private-link">Bộ từ vựng</a>
            </nav>
        </div>
        <div class="header-right">
            <div class="auth-buttons">
                <a href="login.html" class="btn-login">Đăng nhập</a>
                <a href="signup.html" class="btn-signup">Đăng ký</a>
            </div>
        </div>
    </header>

    <main id="content">
        <div class="history-layout-container">

            <aside class="filter-sidebar">
                <h3 style="margin-bottom: 15px; font-size: 1.2rem; border-bottom: 2px solid #eee; padding-bottom: 5px;">
                    <i class="fas fa-filter"></i> Bộ lọc
                </h3>

                <div class="filter-actions" style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <button id="btn-filter-all" class="filter-btn active-filter">Tất cả</button>
                    <button id="btn-filter-today" class="filter-btn">Hôm nay</button>
                </div>

                <div class="date-input-wrapper">
                    <label for="date-picker" style="display:block; margin-bottom: 5px; font-weight: 500;">Hoặc chọn
                        ngày:</label>
                    <input type="date" id="date-picker" class="form-control"
                        style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                </div>


            </aside>

            <section class="history-list-section">

                <h1>Lịch sử tra từ</h1>

                <div class="word-list" id="search-history-list">
                    <p style="text-align: center; color: #666; margin-top: 20px;">Đang tải dữ liệu...</p>
                </div>

                <div id="pagination" class="pagination-container"
                    style="margin-top: 20px; display: flex; justify-content: center; gap: 5px;">
                </div>

            </section>

        </div>
    </main>

    <footer id="footer">
        <div class="footer-content">
            <h3>Wordee</h3>
            <p>&copy; 2025 Wordee. Phát triển bởi bạn.</p>
        </div>
    </footer>
    <script src="../js/index.js"></script>
    <script src="../js/search_history.js"></script>

    <script src="../js/auth.js"></script>

</body>

</html>
